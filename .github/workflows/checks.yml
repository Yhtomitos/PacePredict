name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r tests/tooling/runtime-requirements.txt
      - run: python -B -m unittest discover -s tests -v

  quality:
    name: Ruff, Pyright, Bandit, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/tooling/runtime-requirements.txt
            tests/tooling/requirements.txt
      - run: python -m pip install -r tests/tooling/requirements.txt
      - name: Ruff lint and import sorting
        run: python -m ruff check --config tests/tooling/ruff.toml --output-format=github main.py scripts tests
      - name: Ruff formatting
        if: ${{ !cancelled() }}
        run: python -m ruff format --config tests/tooling/ruff.toml --check main.py scripts tests
      - name: Pyright
        if: ${{ !cancelled() }}
        run: python -m pyright --project tests/tooling/pyrightconfig.json
      - name: Bandit
        if: ${{ !cancelled() }}
        run: python -m bandit -c tests/tooling/bandit.toml -r main.py scripts tests
      - name: Audit runtime and developer dependencies
        if: ${{ !cancelled() }}
        run: python -m pip_audit -r tests/tooling/requirements.txt --strict

  semgrep:
    name: Semgrep custom rules and rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/tooling/requirements-semgrep.txt
      - run: python -m pip install -r tests/tooling/requirements-semgrep.txt
      - name: Test custom rules against positive and negative examples
        run: semgrep --test tests/semgrep --metrics=off
      - name: Scan Python sources
        run: >-
          semgrep scan --config tests/semgrep/invariants.yml --error --metrics=off
          --no-git-ignore --exclude tests/semgrep --exclude training-data
          main.py scripts tests/*.py
